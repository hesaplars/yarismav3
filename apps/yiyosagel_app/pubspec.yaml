name: yiyosagel_app
description: YiyosaGel native Android and web application.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  cloud_firestore: ^5.6.0
  cloud_functions: ^5.2.0
  cupertino_icons: ^1.0.8
  firebase_auth: ^5.4.0
  firebase_core: ^3.9.0
  firebase_database: ^11.2.0
  firebase_messaging: ^15.1.6
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_sign_in: ^6.2.2
  image_picker: ^1.1.2
  in_app_purchase: ^3.2.0
  intl: ^0.20.1
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/avatars/
    - assets/images/
